<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(34, 211, 238, 0.25)" stroke-width="1.5"/>

  <!-- Rising Sun / Farol Glow -->
  <circle cx="44" cy="20" r="8" fill="url(#sunGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Green Eco Leaf Accent -->
  <path d="M42 22 C42 16 36 12 36 12 C36 12 34 18 36 22 C38 26 42 22 42 22 Z" fill="url(#leafGrad)" opacity="0.9"/>

  <!-- Ocean Waves -->
  <!-- Back Deep Wave -->
  <path d="M4 42 C14 36 22 46 32 40 C42 34 50 44 60 38 L60 60 L4 60 Z" fill="#0e7490" opacity="0.5"/>

  <!-- Main Vibrant Cyan Wave -->
  <path d="M4 46 C16 38 24 50 36 44 C46 38 52 46 60 42 L60 60 L4 60 Z" fill="url(#waveCyan)" filter="url(#glow)"/>

  <!-- Foam Crest Accent -->
  <path d="M12 43 C18 40 22 45 28 44" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M38 43 C44 40 48 44 54 42" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>

